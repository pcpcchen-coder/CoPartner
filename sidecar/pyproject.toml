[project]
name = "copartner-sidecar"
version = "0.0.1"
description = "CoPartner 本地推理 sidecar：MLX (Qwen2.5-VL) 視覺語意 + Vision OCR fallback"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "mlx-vlm>=0.1.0",       # Apple Silicon 上跑 Qwen2.5-VL
    "pillow>=11.0",
    "ocrmac>=1.0.0",        # macOS Vision VNRecognizeTextRequest wrapper（zh-Hant+en）
]

[project.scripts]
copartner-sidecar = "copartner_sidecar.server:main"

# 讓 uv 把本專案當「套件」安裝（含上面的 copartner-sidecar script）——
# 缺這段時 uv 視為 non-package 專案，`uv run copartner-sidecar` 會 spawn 失敗。
# CI 的 python job 用 `uv run --no-project`，不受此影響。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copartner_sidecar"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[tool.ruff]
line-length = 100
