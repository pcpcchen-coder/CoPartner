name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # build 與 test 都要把錯誤印成 annotation。
      # 上一次只包了 test，結果 build 掛掉時整個 job 只留下「exit code 1」——
      # 在一個拿不到完整 log 的環境裡，那等於什麼都沒說。
      - name: Build CoPartnerKit
        run: |
          set -o pipefail
          swift build --package-path packages/CoPartnerKit 2>&1 | tee /tmp/swift-build.log || {
            grep -E "error:" /tmp/swift-build.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      # 失敗訊息另外用 ::error:: 印一次，讓它變成 check annotation。
      # 原因很實際：完整的 job log 要從 blob storage 下載，而不是每個看 PR 的人
      # （或每個環境）都拿得到；annotation 直接顯示在 PR 上，也讀得到 API。
      # `pipefail` 是重點——沒有它，`tee` 的 0 會蓋掉 swift test 的非 0，
      # 測試失敗會變成 job 成功，那比看不到 log 糟得多。
      - name: Test CoPartnerKit
        run: |
          set -o pipefail
          swift test --package-path packages/CoPartnerKit 2>&1 | tee /tmp/swift-test.log || {
            grep -E "error:|failed|XCTAssert" /tmp/swift-test.log \
              | head -40 | sed 's/^/::error::/'
            exit 1
          }
  python:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint sidecar
        run: |
          cd sidecar
          uvx ruff check .
      - name: Test sidecar
        run: |
          cd sidecar
          PYTHONPATH=. uv run --no-project --with fastapi --with pydantic --with httpx --with pyyaml --with pytest pytest
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd apps/CoPartner && xcodegen generate
      - name: Resolve Swift package dependencies
        run: cd apps/CoPartner && xcodebuild -project CoPartner.xcodeproj -resolvePackageDependencies
      # 探測腳本刻意獨立於 CoPartnerKit（要能用 swiftc 單獨編成 ad-hoc 簽章的外部程序），
      # 因此不在任何 target 裡、平常不會被編到。沒有這一步它會靜默腐爛，
      # 而壞掉的腳本會讓拒絕路徑的驗收得出**假的通過**。
      - name: Type-check XPC probe script
        run: swiftc -typecheck scripts/xpc-probe.swift

      # 同樣把錯誤印成 annotation。xcodebuild 的輸出特別長，
      # 沒有這一步就只剩「exit code 65」——那個數字本身不說明任何事。
      - name: Build app (no signing)
        run: |
          set -o pipefail
          cd apps/CoPartner
          xcodebuild \
            -project CoPartner.xcodeproj \
            -scheme CoPartner \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log || {
              grep -E "error:" /tmp/xcodebuild.log | head -40 | sed 's/^/::error::/'
              exit 1
            }
