name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build CoPartnerKit
        run: swift build --package-path packages/CoPartnerKit
      - name: Test CoPartnerKit
        run: swift test --package-path packages/CoPartnerKit
  python:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint sidecar
        run: |
          cd sidecar
          uvx ruff check .
      - name: Test sidecar
        run: |
          cd sidecar
          PYTHONPATH=. uv run --no-project --with fastapi --with pydantic --with httpx --with pyyaml --with pytest pytest
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd apps/CoPartner && xcodegen generate
      - name: Resolve Swift package dependencies
        run: cd apps/CoPartner && xcodebuild -project CoPartner.xcodeproj -resolvePackageDependencies
      # 探測腳本刻意獨立於 CoPartnerKit（要能用 swiftc 單獨編成 ad-hoc 簽章的外部程序），
      # 因此不在任何 target 裡、平常不會被編到。沒有這一步它會靜默腐爛，
      # 而壞掉的腳本會讓拒絕路徑的驗收得出**假的通過**。
      - name: Type-check XPC probe script
        run: swiftc -typecheck scripts/xpc-probe.swift

      - name: Build app (no signing)
        run: |
          cd apps/CoPartner
          xcodebuild \
            -project CoPartner.xcodeproj \
            -scheme CoPartner \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
